name: Release Please

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_body: ${{ steps.release.outputs.body }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: release.json

  build:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - name: Create test-file
        run: |
          VERSION="${{ needs.release.outputs.tag_name }}"
          touch new-file-${VERSION}.txt

      - name: Create Release & Upload Artifact
        uses: softprops/action-gh-release@v3
        with:
           tag_name: ${{ needs.release.outputs.tag_name }}
           name: Release ${{ needs.release.outputs.tag_name }}
           body: ${{ needs.release.outputs.release_body }}
           files: new-file-${{ needs.release.outputs.tag_name }}.txt
           draft: false
           make_latest: true
